<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equilibra - MVP</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <header>
        <h1>Equilibra - Saúde e Bem-Estar</h1>
    </header>

    <main>
        <!-- TELA DE LOGIN E CADASTRO -->
        <section id="secao-login" class="card">

            <!-- Formulário de login -->
            <div id="area-login">
                <h2>Acessar Conta</h2>

                <form id="form-login">
                    <label for="email">E-mail ou Usuário:</label>
                    <input type="text" id="email" required
                        placeholder="seu usuário">

                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" required
                        placeholder="******">

                    <button type="submit">Entrar</button>
                </form>

                <p>Não tem uma conta?</p>
                <button type="button" id="btn-mostrar-cadastro">
                    Criar conta
                </button>
            </div>

            <!-- Formulário de cadastro -->
            <div id="area-cadastro" style="display: none;">
                <h2>Criar Conta</h2>

                <form id="form-cadastro">
                    <label for="cadastro-usuario">Usuário:</label>
                    <input type="text" id="cadastro-usuario" required
                        placeholder="Escolha um usuário">

                    <label for="cadastro-senha">Senha:</label>
                    <input type="password" id="cadastro-senha" required
                        placeholder="Crie uma senha">

                    <button type="submit">Cadastrar</button>
                </form>

                <p>Já tem uma conta?</p>
                <button type="button" id="btn-mostrar-login">
                    Voltar para o login
                </button>
            </div>

        </section>

        <!-- PAINEL PRINCIPAL -->
        <section id="secao-dashboard" class="card" style="display: none;">
            <h2>Painel Principal</h2>

            <!-- Perfil de saúde -->
            <h3>Meu Perfil de Saúde</h3>

            <form id="form-perfil">
                <label for="idade">Idade:</label>
                <input type="number" id="idade"
                    placeholder="Ex: 20" required>

                <label for="peso">Peso (kg):</label>
                <input type="number" step="0.1" id="peso"
                    placeholder="Ex: 70.5" required>

                <label for="altura">Altura (m):</label>
                <input type="number" step="0.01" id="altura"
                    placeholder="Ex: 1.75" required>

                <label for="objetivo">Objetivo:</label>
                <input type="text" id="objetivo"
                    placeholder="Ex: Ganhar massa, Perder peso" required>

                <button type="submit">Salvar Perfil</button>
            </form>

            <p>
                <strong>Status do Perfil:</strong>
                <span id="status-perfil">Carregando...</span>
            </p>

            <hr>

            <!-- Orientação da IA -->
            <h3>Orientação de Saúde</h3>

            <button id="btn-gerar-ia">
                Pedir Recomendação ao Equilibra
            </button>

            <div id="resultado-ia" class="caixa-resposta">
                Aguardando solicitação...
            </div>

            <br><br>

            <button id="btn-sair" class="btn-perigo">
                Sair da Conta
            </button>
        </section>
    </main>

    <!-- Arquivos JavaScript -->
    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/perfil.js"></script>
    <script src="/js/ia.js"></script>
    <script src="/js/main.js"></script>

</body>
</html>
