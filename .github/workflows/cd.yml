name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish-image:
    name: Publicar imagem no GHCR
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.versioned_image }}

    steps:
      - name: Checkout do commit aprovado pela CI
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Definir imagem
        id: vars
        shell: bash
        run: |
          REPOSITORY="${GITHUB_REPOSITORY,,}"
          FULL_SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${FULL_SHA:0:7}"
          IMAGE_BASE="ghcr.io/${REPOSITORY}"
          echo "image_base=${IMAGE_BASE}" >> "$GITHUB_OUTPUT"
          echo "versioned_image=${IMAGE_BASE}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e publicação
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image_base }}:latest
            ${{ steps.vars.outputs.versioned_image }}

      - name: Resumo
        run: |
          echo "## Equilibra - CD" >> "$GITHUB_STEP_SUMMARY"
          echo "Imagem publicada: ${{ steps.vars.outputs.versioned_image }}" >> "$GITHUB_STEP_SUMMARY"

  deploy-server:
    name: Implantação opcional em servidor
    needs: publish-image
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configurar SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Enviar script
        run: |
          scp -i ~/.ssh/id_ed25519 \
            deploy/deploy.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/equilibra-deploy.sh"

      - name: Implantar
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "chmod +x /tmp/equilibra-deploy.sh && /tmp/equilibra-deploy.sh '${{ needs.publish-image.outputs.image }}'"
