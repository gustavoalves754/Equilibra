name: CI
 
on:
  workflow_dispatch:
 
  pull_request:
    branches:
      - develop
      - qa
      - main
 
  push:
    branches:
      - develop
      - qa
      - main
 
permissions:
  contents: read
 
jobs:
  tests:
    name: Testes automatizados
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
 
      - name: Atualizar pip
        run: python -m pip install --upgrade pip
 
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
 
      - name: Validar estrutura da Issue 1
        run: |
          test -f pytest.ini
          test -d tests/integration
          test -f tests/integration/test_api_base.py
          test -f .env.example
          test ! -f .env
 
          if find . -type f \( -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' \) -print -quit | grep -q .; then
            echo "ERRO: banco SQLite foi versionado."
            exit 1
          fi
 
      - name: Executar testes
        run: python -m pytest -q