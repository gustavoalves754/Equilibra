name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, qa, main]
  push:
    branches: [develop, qa, main]

permissions:
  contents: read

jobs:
  tests:
    name: Testes e cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validar estrutura final
        shell: bash
        run: |
          test -f pytest.ini
          test -f .coveragerc
          test -f Dockerfile
          test -f wsgi.py
          test -d tests/unit
          test -d tests/integration
          test -f .env.example
          test ! -f .env

          if find . -type f \( -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' \) -print -quit | grep -q .; then
            echo "ERRO: banco SQLite real foi versionado."
            exit 1
          fi

      - name: Testes unitários
        run: python -m pytest -q -m unit

      - name: Testes de integração
        run: python -m pytest -q -m integration

      - name: Suíte completa e cobertura
        run: |
          python -m pytest -q \
            --cov=app \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=90

      - name: Resumo
        if: always()
        run: |
          echo "## Equilibra - CI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Testes unitários executados" >> "$GITHUB_STEP_SUMMARY"
          echo "- Testes de integração executados" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cobertura mínima: 90%" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
          retention-days: 14
