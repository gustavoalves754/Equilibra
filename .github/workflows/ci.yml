name: CI

on:
  workflow_dispatch:

  pull_request:
    branches: [develop, qa, main]

  push:
    branches: [develop, qa, main]

permissions:
  contents: read

jobs:
  tests:
    name: Testes automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Atualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Validar estrutura da Issue 5
        run: |
          test -f app/auth.py
          test -f app/database.py
          test -f app/validators.py
          test -f app/prompts.py
          test -f app/gemini_service.py
          test -f tests/integration/test_guidance_api.py
          test -f tests/integration/test_guidance_history.py
          test -f .env.example
          test ! -f .env
          if find . -type f \( -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' \) -print -quit | grep -q .; then
            echo "ERRO: banco SQLite foi versionado."
            exit 1
          fi

      - name: Executar testes unitários
        run: python -m pytest -q -m unit

      - name: Executar testes de integração
        run: python -m pytest -q -m integration

      - name: Gerar cobertura informativa
        run: python -m pytest -q --cov=app --cov-branch --cov-report=term-missing

      - name: Resumo
        if: always()
        run: |
          echo "## Equilibra - CI Issue 5" >> "$GITHUB_STEP_SUMMARY"
          echo "- Funcionalidades das Issues anteriores preservadas" >> "$GITHUB_STEP_SUMMARY"
          echo "- Orientações do Gemini persistidas no equilibra.db" >> "$GITHUB_STEP_SUMMARY"
          echo "- Histórico protegido e isolado por usuário" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bancos reais não são usados durante os testes" >> "$GITHUB_STEP_SUMMARY"
