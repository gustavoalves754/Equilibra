name: CI

on:
  workflow_dispatch:

  pull_request:
    branches: [develop, qa, main]

  push:
    branches: [develop, qa, main]

permissions:
  contents: read

jobs:
  tests:
    name: Testes automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Atualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Validar estrutura da Issue 3
        run: |
          test -f app/auth.py
          test -f app/database.py
          test -f app/validators.py
          test -f tests/unit/test_profile_validators.py
          test -f tests/integration/test_profile_api.py
          test -f tests/integration/test_profile_database.py
          test -f .env.example
          test ! -f .env

          if find . -type f \( -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' \) -print -quit | grep -q .; then
            echo "ERRO: banco SQLite foi versionado."
            exit 1
          fi

      - name: Executar testes unitários
        run: python -m pytest -q -m unit

      - name: Executar testes de integração
        run: python -m pytest -q -m integration

      - name: Gerar cobertura informativa
        run: python -m pytest -q --cov=app --cov-branch --cov-report=term-missing

      - name: Resumo
        if: always()
        run: |
          echo "## Equilibra - CI Issue 3" >> "$GITHUB_STEP_SUMMARY"
          echo "- Autenticação da Issue 2 preservada" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validações de idade, altura, peso e objetivo" >> "$GITHUB_STEP_SUMMARY"
          echo "- users.db e equilibra.db separados e temporários nos testes" >> "$GITHUB_STEP_SUMMARY"
          echo "- InlineData e ClassData adaptados ao pytest" >> "$GITHUB_STEP_SUMMARY"
